name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]

# Never pay for superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # single-os by design — allowlist reason: private-repo cost discipline (macOS bills 10x, Windows
    # 2x on Actions). corpuscrawl is pure Python with no OS-specific code paths, so a Python-version
    # matrix on ubuntu (all 1x runners) fully proves the requires-python claim; a 3-OS matrix would only
    # re-test the toolchain. Portability is enforced in code (pathlib, tempfile) instead of by billed runners.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check corpuscrawl tests
      - name: Test (pytest)
        run: pytest -q
